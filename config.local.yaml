arcanea_claw:
  agent_id: "arcanea-claw-local"
  agent_name: "ArcaneaClaw Local Dev"

  heartbeat:
    interval_seconds: 30
    pipeline_interval_seconds: 60  # 1 min for demo

  scan:
    paths:
      - ./demo-media
    extensions:
      - .jpg
      - .jpeg
      - .png
      - .webp
      - .gif
    ignore_patterns:
      - ".*"
      - "__pycache__"
      - "node_modules"

  process:
    staging_dir: ./data/staging
    output_dir: ./data/processed
    webp_quality: 85
    max_dimension: 2400
    thumbnail_size: 320
    size_variants:
      hero: [1920, 1080]
      gallery: [1200, 800]
      social_square: [1080, 1080]
      social_story: [1080, 1920]
      social_wide: [1200, 628]
      thumbnail: [320, 320]

  upload:
    hero_threshold: 80
    gallery_threshold: 60

  classify:
    model: "gemini-2.0-flash"
    guardians:
      - Lyssandria
      - Leyla
      - Draconia
      - Maylinn
      - Alera
      - Lyria
      - Aiyami
      - Elara
      - Ino
      - Shinkami
    elements:
      - Earth
      - Water
      - Fire
      - Wind
      - Void

  notify:
    enabled: false
    channels: []

  canon:
    reference: ".arcanea/lore/CANON_LOCKED.md"
